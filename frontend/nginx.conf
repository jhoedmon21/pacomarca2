# Servidor de estáticos del frontend (SPA con fallback a index.html)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Assets con hash: caché agresiva
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PWA: el service worker y el manifest deben revalidarse SIEMPRE
    # (si se cachean, un deploy nuevo no llega a los clientes)
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA: cualquier ruta desconocida cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sin indexado de archivos ocultos
    location ~ /\. {
        deny all;
    }
}
