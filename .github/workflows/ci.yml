# CI: lint + tests del backend, lint + build del frontend, y build de imágenes
# Docker. Se ejecuta en cada push/PR a main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt ruff
      - name: Lint (Ruff)
        run: ruff check .
      - name: Tests (pytest)
        run: pytest
        env:
          # Sin credenciales GEE: los tests usan dobles de prueba
          GEE_SERVICE_ACCOUNT_EMAIL: test@example.iam.gserviceaccount.com
          GEE_PRIVATE_KEY_JSON: "{}"

  frontend:
    name: Frontend (ESLint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Lint (ESLint)
        run: npm run lint
      - name: Build de producción
        run: npm run build

  docker:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build imagen backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
      - name: Build imagen frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
