[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errores
    "W",   # pycodestyle avisos
    "F",   # pyflakes
    "I",   # isort (orden de imports)
    "UP",  # pyupgrade (sintaxis moderna)
    "B",   # bugbear (errores comunes)
]
ignore = [
    "E501",  # líneas largas: se controlan con line-length y formateador
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
